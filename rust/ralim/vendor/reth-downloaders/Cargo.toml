# VENDORED — do not edit by hand beyond the `ralim:` marked lines.
#
# A copy of reth-downloaders from the base tag's pinned reth (see
# rust/Cargo.toml), carrying one change: the header and body downloader builders
# wrap their client in ralim-p2p-ratelimit's RateLimitedClient. It is wired in by
# the `[patch]` section of rust/Cargo.toml. Re-vendor on a reth bump with
# ./ralim/vendor-reth-downloaders.sh — see ralim/README.md.

[package]
name = "reth-downloaders"
# Must equal the upstream crate version, or `[patch]` in rust/Cargo.toml is rejected.
version = "2.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Implementations of various block downloaders"

[dependencies]
# ralim: the global P2P download rate limiter this copy wires in
ralim-p2p-ratelimit.workspace = true

# reth
reth-config.workspace = true
reth-consensus.workspace = true
reth-network-p2p.workspace = true
reth-network-peers.workspace = true
reth-primitives-traits.workspace = true
reth-storage-api.workspace = true
reth-tasks.workspace = true

# optional deps for the test-utils feature
reth-ethereum-primitives = { workspace = true, optional = true }
reth-provider = { workspace = true, optional = true }
reth-testing-utils = { workspace = true, optional = true }

# ethereum
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rlp = { workspace = true, optional = true }

# async
futures.workspace = true
futures-util.workspace = true
pin-project.workspace = true
tokio = { workspace = true, features = ["sync", "fs", "io-util"] }
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
async-compression = { workspace = true, features = ["gzip", "tokio"], optional = true }

# metrics
reth-metrics.workspace = true
metrics.workspace = true

# misc
rayon.workspace = true
thiserror.workspace = true
tracing.workspace = true

tempfile = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }

[dev-dependencies]
async-compression = { workspace = true, features = ["gzip", "tokio"] }
reth-ethereum-primitives.workspace = true
reth-chainspec.workspace = true
reth-consensus = { workspace = true, features = ["test-utils"] }
reth-network-p2p = { workspace = true, features = ["test-utils"] }
reth-provider = { workspace = true, features = ["test-utils"] }
reth-testing-utils.workspace = true
reth-tracing.workspace = true

assert_matches.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rand.workspace = true
tempfile.workspace = true
alloy-rlp.workspace = true
itertools.workspace = true

[features]
default = []
file-client = ["dep:async-compression", "dep:alloy-rlp", "dep:itertools"]
test-utils = [
    "tempfile",
    "reth-consensus/test-utils",
    "reth-network-p2p/test-utils",
    "reth-testing-utils",
    "reth-chainspec/test-utils",
    "reth-provider/test-utils",
    "reth-primitives-traits/test-utils",
    "dep:reth-ethereum-primitives",
    "reth-ethereum-primitives?/test-utils",
    "reth-tasks/test-utils",
]
